name: Main CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# call-release uses softprops/action-gh-release@v2 which needs
# contents: write to create a GitHub Release. Reusable workflow
# permissions intersect with the caller's, and GitHub Actions'
# default GITHUB_TOKEN is read-only, so this grant must live here
# (release-worker.yaml declaring it upstream is not enough).
permissions:
  contents: write

jobs:
  call-docker-build:
    uses: ycpss91255-lab/base/.github/workflows/build-worker.yaml@v0.43.0-rc9
    with:
      image_name: seggpt
      # merge_group payload 沒有 head repo 資訊；merge queue 只有 maintainer 能排入，
      # 視為同 repo 可信來源，build job 才不會被 fork guard 略過（base#1587）。
      merge_group_same_repo: 'true'
      context_path: docker
      # The runtime stage is intentionally TODO until Layer 3 (FastAPI
      # server) lands; the Dockerfile only declares sys / base / devel
      # / test for now. Disable runtime build so CI does not try to
      # resolve a missing `runtime` target. Flip back to default (true)
      # in the same PR that uncomments the runtime stage.
      build_runtime: false
      # Mirror docker/setup.toml [[additional_contexts]] repo_root = ".."
      # for CI. Note the asymmetric form (`.` here vs `..` in setup.toml):
      # build-worker resolves paths relative to the repo root (actions/checkout
      # working dir), not to context_path; compose resolves relative to
      # compose.yaml, which lives inside docker/. Same destination, different
      # base. Without this the Dockerfile's `COPY --from=repo_root` lines fail
      # with "no source for 'repo_root'" in CI even though local just docker build
      # works (compose path). See base@v0.16.1 / base#207.
      build_contexts: |
        repo_root=.

  call-release:
    needs: call-docker-build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ycpss91255-lab/base/.github/workflows/release-worker.yaml@v0.43.0-rc9
    with:
      archive_name_prefix: seggpt

  ci-rollup:
    # merge queue 唯一的必要 check：needs 的 job 必須全部 success。
    name: ci-rollup
    if: always()
    needs: [call-docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 確認全部 job 成功
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::未成功的 job：$bad"
            exit 1
          fi
